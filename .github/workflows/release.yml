name: Release Artifacts (tag-driven)
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || 'Release (manual)' }}
on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - build: x86_64-windows
            os: windows-latest
            target: x86_64-pc-windows-gnu

          # Linux
          - build: x86_64-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: aarch64-linux
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # macOS
          - build: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin
          - build: aarch64-macos
            os: macos-latest # 或者明确指定 macos-14
            target: aarch64-apple-darwin

          # Android (AArch64)
          - build: aarch64-android
            os: ubuntu-latest
            target: aarch64-linux-android

          # Android (x86_64)
          - build: x86_64-android
            os: ubuntu-latest
            target: x86_64-linux-android

          # Android (ARMv7, 32-bit, Pulley only)
          - build: armv7-android
            os: ubuntu-latest
            target: armv7-linux-androideabi

          # Android (x86, 32-bit, Pulley only)
          - build: x86-android
            os: ubuntu-latest
            target: i686-linux-android

          # iOS
          - build: aarch64-ios
            os: macos-latest
            target: aarch64-apple-ios
          - build: aarch64-ios-sim
            os: macos-latest
            target: aarch64-apple-ios-sim

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare shell scripts
        run: find ci -type f -name '*.sh' -exec chmod +x {} +

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # === Linux AArch64 交叉编译工具链 ===
      - name: Install AArch64 Toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      # === Android 环境配置 ===
      - name: Setup Android Environment
        if: contains(matrix.target, 'android')
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then echo "Error: NDK not found"; exit 1; fi
          # Ubuntu Runner 的 NDK 是 linux-x86_64
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          API=24

          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang" >> $GITHUB_ENV
              echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang++" >> $GITHUB_ENV
              echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${API}-clang" >> $GITHUB_ENV
              ;;
            x86_64-linux-android)
              echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android${API}-clang" >> $GITHUB_ENV
              echo "CXX_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android${API}-clang++" >> $GITHUB_ENV
              echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android${API}-clang" >> $GITHUB_ENV
              ;;
            armv7-linux-androideabi)
              echo "CC_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi${API}-clang" >> $GITHUB_ENV
              echo "CXX_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi${API}-clang++" >> $GITHUB_ENV
              echo "AR_armv7_linux_androideabi=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi${API}-clang" >> $GITHUB_ENV
              ;;
            i686-linux-android)
              echo "CC_i686_linux_android=$TOOLCHAIN/i686-linux-android${API}-clang" >> $GITHUB_ENV
              echo "CXX_i686_linux_android=$TOOLCHAIN/i686-linux-android${API}-clang++" >> $GITHUB_ENV
              echo "AR_i686_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
              echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$TOOLCHAIN/i686-linux-android${API}-clang" >> $GITHUB_ENV
              ;;
          esac

          echo "RUSTFLAGS=-C link-arg=-z -C link-arg=max-page-size=16384" >> $GITHUB_ENV

      - name: Build Wasmline bundles
        env:
          WASMTIME_RELEASE_TAG: ${{ github.ref_name }}
        run: ./ci/wasmline/build-target-release.sh "${{ matrix.build }}" "${{ matrix.target }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
            name: artifacts-bins-${{ matrix.build }}
            path: bins-*/**
            retention-days: 1

  release:
    name: Merge and Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare shell scripts
        run: find ci -type f -name '*.sh' -exec chmod +x {} +

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Flatten Artifacts Structure
        run: |
          echo "Before flatten:"
          ls -R
          mv artifacts-bins-*/bins-* . || true
          echo "After flatten:"
          ls -d bins-*
      - name: Merge Artifacts
        run: |
          ./ci/wasmline/merge-artifacts.sh
          ls -l dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/release-v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Wasmtime ${{ github.ref_name }}
          files: dist/*
          draft: true
          prerelease: false
